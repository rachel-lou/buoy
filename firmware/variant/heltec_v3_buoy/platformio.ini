; Heltec V3 + the Rust buoy controller. Lives in the buoy repo (firmware/variant/heltec_v3_buoy)
; and is symlinked into the Meshtastic tree by firmware/setup.sh.
[env:heltec-v3-buoy]
extends = env:heltec-v3
board_level = extra
build_flags =
  ${env:heltec-v3.build_flags}
  -D BUOY_RUST
extra_scripts =
  ${esp32_common.extra_scripts}
  pre:variants/esp32s3/heltec_v3_buoy/cargo_build.py
