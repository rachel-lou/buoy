language = "C"
include_guard = "BUOY_RS_H"
autogen_warning = "/* Generated by cbindgen from firmware/buoy-rs/src/ffi.rs. Do not edit; run `cargo build` in firmware/buoy-rs. */"
cpp_compat = true
usize_is_size_t = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true

[export]
prefix = ""

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true
