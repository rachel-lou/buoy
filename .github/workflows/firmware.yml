# Builds the Meshtastic + Rust firmware (firmware/) on Linux and macOS, following the setup
# steps in firmware/README.md.
name: firmware

on:
  push:
    paths: ["firmware/**", ".gitmodules", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["firmware/**", ".gitmodules", ".github/workflows/firmware.yml"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest] # macos-latest is Apple Silicon
    runs-on: ${{ matrix.os }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # espup uses it to avoid GitHub API rate limits
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install PlatformIO 6.1.19
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          ~/.local/bin/uv venv --seed --python 3.12 ~/.platformio/penv
          ~/.local/bin/uv pip install --python ~/.platformio/penv/bin/python "platformio==6.1.19"
          echo "$HOME/.platformio/penv/bin" >> "$GITHUB_PATH"

      - name: Install Rust + esp toolchain
        run: |
          rustup toolchain install stable --profile minimal
          cargo install espup --locked
          espup install --targets esp32s3 --name esp

      - name: Rust host tests
        working-directory: firmware/buoy-rs
        run: |
          cargo +stable test --target "$(rustc +stable -vV | sed -n 's/^host: //p')"

      - name: Link buoy code into Meshtastic
        run: firmware/setup.sh

      - name: Build heltec-v3-buoy
        working-directory: firmware/meshtastic
        run: pio run -e heltec-v3-buoy

      - name: Check generated header is committed
        run: git diff --exit-code firmware/buoy-rs/include/buoy_rs.h
